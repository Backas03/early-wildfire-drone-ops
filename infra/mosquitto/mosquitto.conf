# Mosquitto 설정
#
# 윈도우 서비스("mosquitto.exe run")는 C:\Program Files\mosquitto\mosquitto.conf 를 읽는다.
# 이 파일을 고치면 그 자리에 복사하고 서비스를 다시 시작한다 (관리자 PowerShell):
#   Copy-Item infra\mosquitto\mosquitto.conf "C:\Program Files\mosquitto\mosquitto.conf"
#   Restart-Service mosquitto
#
# 지금(책상 시험): 연구실 LAN의 라즈베리파이가 접속한다. 로그인은 없고,
# 대신 Windows 방화벽에서 1883번 포트를 라즈베리파이 IP에서 오는 것만 허용한다:
#   New-NetFirewallRule -DisplayName "Mosquitto MQTT from pi-vitamin" -Direction Inbound `
#     -Protocol TCP -LocalPort 1883 -RemoteAddress <라즈베리파이 IP> -Action Allow -Profile Any
#
# 실제 비행(LTE + Tailscale) 전에는 로그인을 켠다:
#   1) 비밀번호 파일 생성 (관리자 PowerShell):
#        & "C:\Program Files\mosquitto\mosquitto_passwd.exe" -c "C:\Program Files\mosquitto\passwd" drone1
#   2) 아래 allow_anonymous를 false로, password_file 줄의 주석을 푼다
#      (edge-ai·drone-agent에 로그인 옵션을 넣어야 한다)

per_listener_settings true

# 모든 네트워크에서 받는다. 이 PC 안의 서버들은 127.0.0.1로 붙는다.
# 바깥 접속은 Windows 방화벽 규칙이 거른다.
listener 1883
allow_anonymous true
# password_file C:\Program Files\mosquitto\passwd

persistence false
log_type error
log_type warning
log_type notice
