# Mosquitto 설정 (드론 연결 단계용)
#
# 지금(0~2단계)은 윈도우 서비스로 설치된 기본 설정을 그대로 쓴다.
#   - 기본 설정: 이 PC 안(localhost:1883)에서만 접속 가능, 로그인 없음
#
# 실제 드론(RPi)이 LTE + Tailscale로 접속해야 할 때 이 파일을 쓴다:
#   1) 아래 Tailscale IP 줄의 주석을 풀고 이 PC의 Tailscale IP(100.x.y.z)를 넣는다
#   2) 비밀번호 파일 생성 (관리자 PowerShell):
#        & "C:\Program Files\mosquitto\mosquitto_passwd.exe" -c passwd drone1
#   3) 서비스를 멈추고 이 설정으로 실행하거나, 서비스 설정 파일에 내용을 복사한다

per_listener_settings true

# 이 PC 안의 서버들 (로그인 없음)
listener 1883 127.0.0.1
allow_anonymous true

# 드론 (Tailscale 망에서만, 로그인 필요)
# listener 1883 100.x.y.z
# allow_anonymous false
# password_file passwd

persistence false
log_type error
log_type warning
log_type notice
